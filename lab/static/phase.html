<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sorting Cell Phase</title><link rel="stylesheet" href="/static/lab.css"></head><body>
<header><a href="/">← lab</a><h1 id="title">…</h1><span id="st"></span><span class="sub" id="disc"></span></header>
<main>
<section class="panel diagram"><h2>Where this sits in the pipeline</h2><div id="dia"></div></section>
<section class="panel blurb" id="blurb"></section>
<section class="panel" id="livep" hidden><h2>Live</h2><div class="live"><img id="liveimg" alt="live stream (start it below)"><div class="bar" id="livebar"></div></div><p class="mute small" id="livenote"></p></section>
<section class="panel" id="mediap" hidden><h2>Stills and videos</h2><div class="media" id="media"></div></section>
<section class="panel" id="nump" hidden><h2>Numbers</h2><div id="nums"></div></section>
<section class="panel" id="jobp" hidden><h2>Run it yourself</h2><p class="mute small">These buttons run the same scripts the agents run (under the memory guard) and stream their output here.</p><div id="jobs"></div></section>
</main>
<script src="/static/lab.js"></script>
<script>
const pid = location.pathname.split("/").pop();
const fmt = (v) => typeof v === "number" ? (Math.abs(v) >= 100 || Number.isInteger(v) ? String(v) : v.toPrecision(3)) : (typeof v === "boolean" ? (v ? "yes" : "no") : (v === null || v === undefined ? "–" : String(v)));
const dig = (o, path) => path.split(".").reduce((a, k) => (a == null ? a : a[k]), o);

async function numbers(spec) {
  const box = $("#nums"); $("#nump").hidden = false;
  for (const n of spec) {
    const sec = h("div", {}, h("h3", {}, n.label)); box.append(sec);
    let d; try { d = await getJSON("/api/file?path=" + encodeURIComponent(n.file)); } catch (e) { sec.append(h("p", {class: "mute small"}, "not produced yet (" + n.file + ")")); continue; }
    if (n.table) {   // an object of rows: {rowKey: {col: value}}
      const rows = dig(d, n.table); const cols = n.cols || Object.keys(Object.values(rows)[0] || {});
      const t = h("table", {}, h("tr", {}, h("th", {}, n.rowLabel || ""), ...cols.map(c => h("th", {}, (n.colLabels || {})[c] || c))));
      for (const [k, r] of Object.entries(rows)) t.append(h("tr", {}, h("td", {}, k), ...cols.map(c => h("td", {class: "num"}, fmt(r[c])))));
      sec.append(t);
    }
    if (n.keys) { const t = h("table"); for (const k of n.keys) t.append(h("tr", {}, h("th", {}, (n.keyLabels || {})[k] || k), h("td", {class: "num"}, fmt(typeof dig(d, k) === "object" ? JSON.stringify(dig(d, k)) : dig(d, k))))); sec.append(t); }
    if (n.note) sec.append(h("p", {class: "mute small"}, n.note));
  }
}

function jobForm(j) {
  const knobs = {}; const box = h("div", {class: "job"}, h("b", {}, j.label), h("div", {class: "small mute"}, j.help || ""));
  const kn = h("div", {class: "knobs"});
  for (const k of j.knobs || []) {
    let inp;
    if (k.type === "select") { inp = h("select"); for (const o of k.options) inp.append(h("option", o === k.default ? {selected: ""} : {}, o)); }
    else inp = h("input", {type: k.type === "number" ? "number" : "text", value: k.default ?? "", ...(k.min !== undefined ? {min: k.min} : {}), ...(k.max !== undefined ? {max: k.max} : {}), ...(k.step ? {step: k.step} : {}), size: 14});
    knobs[k.name] = inp; kn.append(h("label", {}, k.label || k.name, inp));
  }
  const pre = h("pre", {class: "log", hidden: ""}); const btn = h("button", {}, j.button || "Run");
  btn.onclick = async () => {
    btn.disabled = true; pre.hidden = false; pre.textContent = "";
    const body = {knobs: Object.fromEntries(Object.entries(knobs).map(([k, el]) => [k, el.value]))};
    const r = await fetch("/api/run/" + j.id, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)}); const m = await r.json();
    if (!r.ok) { pre.textContent = m.error; btn.disabled = false; return; }
    follow(m.id, pre, (meta) => { btn.disabled = false; if (j.after === "reload-media") loadMedia(); });
  };
  box.append(kn, btn, pre); return box;
}

let PAGE;
async function loadMedia() {
  const box = $("#media"); box.innerHTML = "";
  for (const m of PAGE.media || []) {
    const ok = (await getJSON("/api/exists?path=" + encodeURIComponent(m.src))).exists;
    const src = "/media/" + m.src + "?t=" + Date.now();
    const el = !ok ? h("div", {class: "card mute small"}, "not in the repository (videos are regenerated by the phase's media command): " + m.src) : (m.kind === "video" ? h("video", {src, controls: "", loop: "", muted: "", playsinline: "", preload: "metadata"}) : h("a", {href: src, target: "_blank"}, h("img", {src, loading: "lazy", alt: m.caption || ""})));
    box.append(h("figure", {}, el, h("figcaption", {}, m.caption || "")));
  }
  $("#mediap").hidden = !(PAGE.media || []).length;
}

async function live(spec) {
  // spec: {base, job (the JOBS id that starts the stream), kind: "belt" | "pick", note}
  $("#livep").hidden = false; const img = $("#liveimg"), bar = $("#livebar"), base = spec.base || "http://127.0.0.1:8801", job = spec.job || "live-stream", kind = spec.kind || "belt";
  let st = {};
  const info = h("b", {}, "?");
  const show = () => { info.textContent = kind === "belt" ? (st.speed ?? 0).toFixed(2) + " m/s" : (st.tally || st.score || ""); };
  const set = async (q) => { try { st = await (await fetch(base + "/set?" + q)).json(); show(); } catch (e) {} };
  const start = h("button", {}, "Start live view");
  start.onclick = async () => { start.disabled = true; await fetch("/api/run/" + job, {method: "POST", headers: {"Content-Type": "application/json"}, body: "{}"}); setTimeout(connect, 5000); };
  const connect = async () => { try { st = await (await fetch(base + "/state")).json(); img.src = base + "/stream.mjpg"; show(); start.hidden = true; $("#livenote").textContent = spec.note || ""; } catch (e) { start.disabled = false; $("#livenote").textContent = "not running; press Start (it takes a few seconds)"; } };
  bar.append(start);
  let cams = ["cell", "overhead", "belt", "end"];
  if (kind === "belt") {
    bar.append(h("span", {}, "belt "), h("button", {class: "ghost", onclick: () => set("speed=" + Math.max(0, (st.speed || 0.3) - 0.05).toFixed(2))}, "−"), info,
      h("button", {class: "ghost", onclick: () => set("speed=" + Math.min(0.8, (st.speed || 0.3) + 0.05).toFixed(2))}, "+"),
      h("button", {class: "ghost", onclick: () => set("running=toggle")}, "stop / start belt"), h("button", {class: "ghost", onclick: () => set("drop=1")}, "drop an item"),
      h("button", {class: "ghost", onclick: () => set("hulls=toggle")}, "collision shapes"), h("button", {class: "ghost", onclick: () => set("reset=1")}, "reset"));
  } else if (kind === "shift") {
    bar.append(h("a", {href: "/dashboard"}, "open the dashboard"), info); connect(); return;
  } else if (kind === "desk") {
    cams = ["desk", "front", "side", "top"];
    const sel = (key, opts, label) => { const el = h("select", {onchange: () => set(key + "=" + el.value)}); for (const [v, l] of opts) el.append(h("option", {value: v}, l)); bar.append(h("span", {}, " " + label + " "), el); };
    sel("policy", [["alternate", "alternate"], ["classical", "classical"], ["onnx", "ONNX policy"]], "pick by");
    sel("rate", [["1", "real time"], ["2", "2x"], ["4", "4x"], ["0.5", "half speed"]], "speed");
    bar.append(h("button", {class: "ghost", onclick: () => set("running=toggle")}, "pause / run"), info);
    setInterval(() => { if (start.hidden) set(""); }, 2000);
  } else if (kind === "line") {
    cams = ["pick", "cell", "overhead", "belt", "end"];
    const sel = (key, opts, label) => { const el = h("select", {onchange: () => set(key + "=" + el.value)}); for (const [v, l] of opts) el.append(h("option", {value: v}, l)); bar.append(h("span", {}, " " + label + " "), el); };
    sel("speed", [["0.3", "0.30"], ["0.15", "0.15"], ["0.4", "0.40"], ["0.5", "0.50"]], "belt m/s");
    sel("rate", [["8", "8"], ["4", "4"], ["12", "12"], ["16", "16"]], "arrivals/min");
    sel("scheduler", [["lookahead", "lookahead"], ["edf", "edf"], ["greedy", "greedy"]], "scheduler");
    sel("carry", (spec.carries || ["f2", "learned", "prior", "student"]).map(c => [c, c]), "carry");
    sel("perception", (spec.perceptions || ["privileged", "vision"]).map(c => [c, c]), "perception");
    sel("sim", [["1", "real time"], ["2", "2x"], ["4", "4x"]], "speed");
    bar.append(h("button", {class: "ghost", onclick: () => set("running=toggle")}, "pause / run"), info);
    setInterval(() => { if (start.hidden) set(""); }, 2000);
  } else {
    cams = ["pick", "cell", "overhead", "belt", "end"];
    const rate = h("select", {onchange: () => set("rate=" + rate.value)}); for (const [v, l] of [["1", "real time"], ["2", "2x"], ["4", "4x"], ["0.5", "half speed"]]) rate.append(h("option", {value: v}, l));
    const item = h("select", {onchange: () => set("item=" + item.value)}); for (const i of ["any"].concat(spec.items || [])) item.append(h("option", {}, i));
    bar.append(h("span", {}, "speed "), rate, h("span", {}, " item "), item, h("button", {class: "ghost", onclick: () => set("running=toggle")}, "pause / run"), info);
    setInterval(() => { if (start.hidden) set(""); }, 2000);
  }
  const cam = h("select", {onchange: () => set("cam=" + cam.value)}); for (const c of cams) cam.append(h("option", {}, c)); bar.append(h("span", {}, " camera "), cam);
  connect();
}

(async () => {
  let page; try { page = await getJSON("/api/phase/" + pid); } catch (e) { $("#title").textContent = pid; $("#blurb").innerHTML = "<p>No page for this phase yet. It arrives when the phase starts.</p>"; diagram($("#dia"), {highlight: [pid]}); return; }
  PAGE = page; document.title = page.title + " · Lab";
  const {status} = await getJSON("/api/phases");
  $("#title").textContent = page.title; $("#st").append(chip(status[pid])); $("#disc").textContent = (page.disciplines || []).join(" · ");
  diagram($("#dia"), {highlight: [pid, ...(page.highlight || [])], status});
  for (const b of page.blurb || []) $("#blurb").append(h("h2", {}, b.h), ...b.p.map(t => h("p", {html: t})));
  if (page.live) live(page.live);
  await loadMedia();
  if (page.numbers) numbers(page.numbers);
  if (page.jobs) { $("#jobp").hidden = false; for (const j of page.jobs) $("#jobs").append(jobForm(j)); }
})();
</script></body></html>
